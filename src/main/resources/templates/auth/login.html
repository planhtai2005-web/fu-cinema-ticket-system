
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập | FU Cinema</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            text-align: center;
            color: #1f2937;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin: 16px 0 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #111827;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #374151;
        }

        .error {
            margin-top: 16px;
            padding: 10px;
            color: #991b1b;
            background: #fee2e2;
            border-radius: 6px;
        }

        .success {
            margin-top: 16px;
            padding: 10px;
            color: #166534;
            background: #dcfce7;
            border-radius: 6px;
        }

        .field-error {
            display: block;
            margin-top: 5px;
            color: #b91c1c;
            font-size: 13px;
        }
    </style>
</head>
<body>
<main class="login-card">
    <h1>FU Cinema</h1>
    <p class="subtitle">Đăng nhập vào tài khoản của bạn</p>

    <div class="success"
         th:if="${success}"
         th:text="${success}"></div>

    <div class="error"
         th:if="${error}"
         th:text="${error}"></div>

    <form th:action="@{/login}"
          th:object="${form}"
          method="post">

        <label for="username">Tên đăng nhập / Email</label>
        <input id="username"
               type="text"
               th:field="*{username}"
               autocomplete="username"
               required>
        <span class="field-error"
              th:if="${#fields.hasErrors('username')}"
              th:errors="*{username}"></span>

        <label for="password">Mật khẩu</label>
        <input id="password"
               type="password"
               th:field="*{password}"
               autocomplete="current-password"
               required>
        <span class="field-error"
              th:if="${#fields.hasErrors('password')}"
              th:errors="*{password}"></span>

        <button type="submit">Đăng nhập</button>
    </form>
</main>
</body>
</html>
