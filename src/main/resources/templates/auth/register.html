
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký tài khoản - FU Cinema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 650px">
    <h2 class="text-center mb-4">Đăng ký tài khoản</h2>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/register}" th:object="${form}" method="post">
        <div class="mb-3">
            <label class="form-label">Họ và tên</label>
            <input type="text" class="form-control"
                   th:field="*{fullName}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{fullName}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control"
                   th:field="*{email}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{email}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Số điện thoại</label>
            <input type="tel" class="form-control"
                   th:field="*{mobile}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{mobile}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Ngày sinh</label>
            <input type="date" class="form-control"
                   th:field="*{birthday}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{birthday}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">CCCD</label>
            <input type="text" class="form-control"
                   th:field="*{identityCard}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{identityCard}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Mật khẩu</label>
            <input type="password" class="form-control"
                   th:field="*{password}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{password}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Xác nhận mật khẩu</label>
            <input type="password" class="form-control"
                   th:field="*{confirmPassword}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
        </div>

        <button type="submit" class="btn btn-primary w-100">Đăng ký</button>
    </form>

    <p class="text-center mt-3">
        Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a>
    </p>
</main>
</body>
</html>
